services:
  postgres:
    cpus: 1.5
    mem_limit: 1g
    memswap_limit: 1536m
  app-observed:
    cpus: 1.5
    mem_limit: 1g
    memswap_limit: 1536m
    environment:
      DEMO_EVENT_AUDIT: 'true'
      OUTBOX_CLAIM_SIZE: '500'
      OUTBOX_SEND_CONCURRENCY: '8'
      OUTBOX_QUEUE_LIMIT: '10000'
      EVENT_RECEIPT_POLL_BATCHES: '32'
      OUTBOX_TELEMETRY_INTERVAL_MS: '60000'
  localstack:
    image: ${JUNGLE_SQS_IMAGE:-jungle-localstack:4.9.2-fifo-ttl-v1}
    build:
      context: .
      dockerfile: docker/localstack/Dockerfile
    cpus: 1.0
    mem_limit: 2g
    healthcheck:
      test: [CMD, awslocal, sqs, get-queue-url, --queue-name, wager-events.fifo]
  demo:
    image: ${JUNGLE_DEMO_IMAGE:?required}
    restart: unless-stopped
    init: true
    command: [bun, demo/main.ts]
    environment:
      DEMO_API_URLS: http://app-observed:3000
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: '3000'
      DEMO_PUBLIC_ORIGIN: https://${JUNGLE_DOMAIN:-jungle.subiu.dev}
      DEMO_JOURNAL_PATH: /app/.tmp/decolagem-session.json
      DEMO_INITIAL_BALANCE: '100.00'
      DEMO_PEERS: '1000'
      DEMO_WALLET_MODE: independent
      DEMO_AUTOPLAY: 'true'
      DEMO_PEERS_PER_ROUND: '1000'
      DEMO_RENEW_EXHAUSTED_WALLETS: 'false'
      DEMO_BETTING_WINDOW_MS: '5000'
    volumes: [server-demo:/app/.tmp]
    networks: [private, edge]
    ports: ['127.0.0.1:${JUNGLE_DEMO_PORT:-39324}:3000']
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 35s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${JUNGLE_EDGE_NETWORK:-subiu_edge}
      traefik.http.routers.jungle-demo.rule: Host(`${JUNGLE_DOMAIN:-jungle.subiu.dev}`) && (Path(`/`) || Path(`/client.js`) || Path(`/style.css`) || PathPrefix(`/vendor/`) || PathPrefix(`/demo/`))
      traefik.http.routers.jungle-demo.entrypoints: web
      traefik.http.routers.jungle-demo.priority: '150'
      traefik.http.routers.jungle-demo.service: jungle-demo
      traefik.http.services.jungle-demo.loadbalancer.server.port: '3000'
      traefik.http.services.jungle-demo.loadbalancer.healthcheck.path: /demo/health
      traefik.http.services.jungle-demo.loadbalancer.healthcheck.interval: 10s
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "const r = await fetch('http://127.0.0.1:3000/demo/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 15s
volumes:
  server-demo:
