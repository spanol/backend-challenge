name: Quality and financial guarantees

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Start real infrastructure
        run: docker compose up -d postgres localstack --wait
      - name: Static checks and isolated test suites
        run: bun run verify:full
      - name: Collect infrastructure logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/infrastructure.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop ephemeral infrastructure
        if: always()
        run: docker compose down
