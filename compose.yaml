name: jungle-challenge
x-runtime-env: &app-env
  DATABASE_URL: postgresql://wagering_app:local-app-only@postgres:5432/wagering
  SQS_ENDPOINT: http://localstack:4566
  PORT: '3000'
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: wagering_owner
      POSTGRES_PASSWORD: local-owner-only
      POSTGRES_DB: wagering
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - wagering-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering_owner -d wagering']
      interval: 2s
      timeout: 2s
      retries: 30
  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
      PERSISTENCE: '1'
    ports:
      - '127.0.0.1:${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - wagering-sqs:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'awslocal', 'sqs', 'list-queues']
      interval: 2s
      timeout: 5s
      retries: 60
  setup:
    build: .
    profiles: [app, cluster, test, auth, observability]
    environment:
      <<: *app-env
      DATABASE_ADMIN_URL: postgresql://wagering_owner:local-owner-only@postgres:5432/wagering
    command: ['sh', '-c', 'bun run db:migrate && bun run queues:init']
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
  app: &app
    build: .
    profiles: [app, cluster]
    environment: *app-env
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      setup: { condition: service_completed_successfully }
    init: true
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const response = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 8s
      retries: 10
      start_period: 10s
  app-2:
    <<: *app
    profiles: [cluster]
    ports: ['127.0.0.1:${APP_2_PORT:-3001}:3000']
  app-3:
    <<: *app
    profiles: [cluster]
    ports: ['127.0.0.1:${APP_3_PORT:-3002}:3000']
  app-auth:
    <<: *app
    profiles: [auth]
    environment:
      <<: *app-env
      AUTH_ENABLED: 'true'
      OIDC_ISSUER: http://keycloak:8080/realms/jungle-gaming
      OIDC_AUDIENCE: wagering-api
      OIDC_JWKS_URI: http://keycloak:8080/realms/jungle-gaming/protocol/openid-connect/certs
    ports: ['127.0.0.1:${APP_AUTH_PORT:-3100}:3000']
    depends_on:
      setup: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
  app-observed:
    <<: *app
    profiles: [observability]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: distributed-wagering-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    ports: ['127.0.0.1:${APP_OBSERVED_PORT:-3100}:3000']
    depends_on:
      setup: { condition: service_completed_successfully }
      tempo: { condition: service_started }
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    profiles: [auth]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-only}
      KC_HOSTNAME: http://keycloak:8080
      KC_HEALTH_ENABLED: 'true'
    command: ['start-dev', '--import-realm']
    volumes:
      - ./docker/keycloak/jungle-gaming-realm.json:/opt/keycloak/data/import/jungle-gaming-realm.json:ro
    ports: ['127.0.0.1:${KEYCLOAK_PORT:-8180}:8080']
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
  tempo:
    image: grafana/tempo:2.10.4
    profiles: [observability]
    environment:
      GOMEMLIMIT: 384MiB
    mem_limit: 512m
    memswap_limit: 512m
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - wagering-tempo:/var/tempo
    ports: ['127.0.0.1:${TEMPO_PORT:-3200}:3200']
  loki:
    profiles: [observability]
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: [-config.file=/etc/loki.yaml]
    environment:
      GOMEMLIMIT: 288MiB
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki.yaml:ro
      - wagering-loki:/loki
    cpus: 0.2
    mem_limit: 384m
    memswap_limit: 384m
  log-gateway:
    profiles: [observability]
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    environment:
      APPLICATION_CONTAINER: ${COMPOSE_PROJECT_NAME}-app-observed-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/observability/log-gateway-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/observability/log-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    cpus: 0.05
    mem_limit: 32m
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    environment:
      APPLICATION_CONTAINER: ${COMPOSE_PROJECT_NAME}-app-observed-1
      GOMEMLIMIT: 96MiB
    volumes:
      - ./docker/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - wagering-alloy:/var/lib/alloy
    cpus: 0.1
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      log-gateway: { condition: service_started }
      loki: { condition: service_started }
  grafana:
    image: grafana/grafana:13.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-admin-only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3030}:3000']
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }
      loki: { condition: service_started }
  test:
    build: .
    profiles: [test]
    environment:
      <<: *app-env
      DATABASE_ADMIN_URL: postgresql://wagering_owner:local-owner-only@postgres:5432/wagering
    command: ['bun', 'run', 'verify:full']
    depends_on:
      setup: { condition: service_completed_successfully }
volumes:
  wagering-loki:
  wagering-alloy:
  wagering-db:
  wagering-sqs:
  wagering-tempo:
